services:
  redis:
    image: redis:7.4-alpine
    container_name: greentrip-redis-prod
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - greentrip_net

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.prod
    container_name: greentrip-backend-prod
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: production
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: ${FRONTEND_URL:-https://localhost}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-2}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - greentrip_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    container_name: greentrip-frontend-prod
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - greentrip_net

  caddy:
    image: caddy:2.9-alpine
    container_name: greentrip-caddy-prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:-:80}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - greentrip_net

networks:
  greentrip_net:
    driver: bridge

volumes:
  redis_data:
  caddy_data:
  caddy_config:
