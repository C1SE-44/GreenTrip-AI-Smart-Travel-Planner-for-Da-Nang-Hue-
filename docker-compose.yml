services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: greentrip-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - ./.env:/app/.env:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greentrip-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - path: .env
        required: false
    environment:
      - VITE_BACKEND_TARGET=http://backend:8000
      - VITE_API_BASE_URL=/api
      - VITE_API_URL=/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - ./.env:/app/.env:ro
    depends_on:
      backend:
        condition: service_healthy

  # Optional local PostGIS database for offline development
  db:
    image: postgis/postgis:15-3.3-alpine
    container_name: greentrip-db
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
