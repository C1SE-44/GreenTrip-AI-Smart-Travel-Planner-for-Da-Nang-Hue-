<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="referrer" content="no-referrer" />
    <link rel="icon" type="image/svg+xml" href="/leaf-route.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-default>GreenTrip AI</title>
    <meta property="og:image" content="https://bolt.new/static/og_default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://bolt.new/static/og_default.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link rel="preload" as="image" href="/images/landing/danang-1400.webp" imagesrcset="/images/landing/danang-640.webp 640w, /images/landing/danang-1400.webp 1400w" imagesizes="100vw" fetchpriority="high" />
    <style>
      body{margin:0}.app-shell{box-sizing:border-box;min-height:790px;height:94svh;max-height:1050px;background:#e0e8e9 url('/images/landing/danang-1400.webp') center 57%/cover;color:#111;font-family:Arial,sans-serif;position:relative;isolation:isolate}
      .app-shell:before{content:'';position:absolute;inset:0;background:linear-gradient(180deg,#fff9 0%,#fff9 37%,#fff0 62%,#fff0 75%,#fff 100%);z-index:-1}
      .app-shell header{height:80px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;padding:0 32px}.app-shell a{color:inherit;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}.app-shell strong{font-size:27px;letter-spacing:-1.5px}.app-shell main{text-align:center;padding:45px 24px 0}.app-shell h1{font-size:clamp(52px,6.2vw,88px);letter-spacing:-4.5px;line-height:1.15;margin:0}.app-shell p{font-size:16px;line-height:1.7;color:#494949;margin:20px 0 26px}.app-shell .boot-action{background:#000;color:white;padding:5px 24px;border-radius:40px;font-size:14px}.app-shell .boot-status{font-size:12px;margin:14px 0}.app-shell.app-loading{min-height:100svh;height:auto;background:#fcfaf5}.app-shell.app-loading main{padding-top:100px}.app-shell.app-loading h1{font-size:28px;letter-spacing:-1px}
      @media(max-width:600px){.app-shell header{padding:0 20px}.app-shell main{padding-top:65px}.app-shell h1{font-size:44px;letter-spacing:-2px}}
    </style>
  </head>
  <body>
    <div id="root"><div class="app-shell" aria-busy="true"><header><a href="/" aria-label="GreenTrip — Trang chủ"><strong>greentrip</strong></a><a href="/planner">Lập lịch trình</a></header><main><h1>Khám phá Đà Nẵng, Huế.</h1><p>Chọn nơi muốn đến, xem gợi ý theo ngày.<br/>Chuyến đi bắt đầu từ đây.</p><a class="boot-action" href="/explore">Khám phá địa điểm</a><p class="boot-status" role="status">Đang mở GreenTrip…</p></main></div></div>
    <script>
      if (!['/','/login','/register','/onboarding'].includes(location.pathname)) {
        document.querySelector('.app-shell').classList.add('app-loading');
        document.querySelector('.app-shell h1').textContent='Chuyến đi của bạn';
        document.querySelector('.app-shell main>p').textContent='Đang mở trang…';
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
